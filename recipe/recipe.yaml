schema_version: 1

context:
  version: "1.3.0"

package:
  name: pybinny
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pybinny/pybinny-${{ version }}.tar.gz
  sha256: 80febabff7b82790cd7c22fbecb3dc34e3aac8164a30f1f99200b664da1e0593

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - pyyaml
    - scipy
    - cmasher
    - matplotlib-base
    - derivkit


tests:
  - python:
      imports:
        - binny
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Flexible tomographic binning algorithms for cosmology.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/pybinny/

extra:
  recipe-maintainers:
    - lonbar
