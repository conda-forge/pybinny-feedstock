schema_version: 1

context:
  version: "0.8.0"

package:
  name: pybinny
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pybinny/pybinny-${{ version }}.tar.gz
  sha256: 9ace1cdbfff2c993107c495125cc9778fb5996751eb7239330249102468f31f8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - pyyaml
    - scipy
    - cmasher

tests:
  - python:
      imports:
        - binny
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Flexible tomographic binning algorithms for cosmology.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/pybinny/

extra:
  recipe-maintainers:
    - lonbar
