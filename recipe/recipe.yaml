schema_version: 1

context:
  version: "0.7.0"

package:
  name: pybinny
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/pybinny/pybinny-${{ version }}.tar.gz
  sha256: fa359372d709e515e274426bcd94f04787bf6e3af8edef27a082ecee801e91a7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - pyyaml
    - scipy
    - cmasher

tests:
  - python:
      imports:
        - binny
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Flexible tomographic binning algorithms for cosmology.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/pybinny/

extra:
  recipe-maintainers:
    - lonbar
